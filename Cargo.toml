[package]
name = "yapcore"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
description = "An async Rust framework for building Yapper bots"
repository = "https://github.com/ImTasell/Yapcore"
readme = "README.md"

[lib]
name = "yapcore"
path = "src/lib.rs"

[features]
default = []

[dependencies]
fastrand = "2.5"
httpdate = "1.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.54", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
wiremock = "0.6.5"
